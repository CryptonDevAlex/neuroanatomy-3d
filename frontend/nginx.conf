server {
    listen 4200;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Soporte para rutas SPA en Angular
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso para llamadas /api hacia el backend en Docker
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Cache agresivo para assets estáticos y modelos 3D
    location ~* \.(?:ico|css|js|gif|jpe?g|png|glb|gltf|woff2?|eot|ttf|svg)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
