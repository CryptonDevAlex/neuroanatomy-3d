version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: neuroanatomy-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=mock
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - CHROMA_PERSIST_DIR=/app/chroma_db
      - ALLOWED_ORIGINS=http://localhost:4200,http://127.0.0.1:4200
    volumes:
      - chroma_data:/app/chroma_db
    networks:
      - neuroanatomy-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: neuroanatomy-frontend
    restart: unless-stopped
    ports:
      - "4200:4200"
    depends_on:
      - backend
    networks:
      - neuroanatomy-net

volumes:
  chroma_data:
    name: neuroanatomy_chroma_data

networks:
  neuroanatomy-net:
    name: neuroanatomy_network
    driver: bridge
